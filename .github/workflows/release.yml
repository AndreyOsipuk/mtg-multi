name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # check-latest: without it setup-go takes the 1.26.x cached on the
      # runner image, which lags Go security releases by days.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - run: go version

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
